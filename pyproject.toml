[project]
name = "model-server"
version = "0.1.0"
description = "FastAPI model server for asynchronous scan transforms"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.5.0",
    "uvicorn[standard]>=0.30.0",
    # MinIO / S3 (aiobotocore 우선, 없으면 boto3 동기 fallback)
    "aiobotocore>=2.13.0",
    "boto3>=1.35.0",
]

[tool.uv]
package = false
